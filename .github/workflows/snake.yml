name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *" # every day at 6:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Builds the snake from my real contribution graph, in my portfolio colors
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4a6741&color_dots=#ebedf0,#cfdcc6,#a9c49a,#6f9165,#2f4a37
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a9c49a&color_dots=#161b22,#24392a,#2f4a37,#6f9165,#a9c49a

      # Publishes them on the "output" branch, used by the README
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
